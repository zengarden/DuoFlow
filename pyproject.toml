[project]
name = "DuoFlow"
version = "0.0.1"
description = "DuoFlow: JVP-Free Finite-Difference Mean Flows for One-Step Image Generation"
authors = [{ name = "LI Zeming", email = "zane.li@connect.ust.hk" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "diffusers==0.32.1",
    "timm==1.0.12",
    "lmdb==1.7.3",
    "pillow==11.3.0",
    "numpy==1.26.4",
    "tqdm==4.67.1",
    "TinyExp[pytorch]==0.1.4",
    "torch-fidelity",
    "einops==0.8.1",
]

[project.urls]
Repository = "https://github.com/zengarden/DuoFlow"
# Homepage = "https://zengarden.github.io/tiny-meanflow/"
# Documentation = "https://zengarden.github.io/tiny-meanflow/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.0",
    "tox-uv>=1.29.0",
    "mypy>=1.19.0",
    "ruff>=0.14.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_meanflow"]

[tool.mypy]
files = ["tiny_meanflow"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.uv.sources]
torch-fidelity = { git = "https://github.com/LTH14/torch-fidelity.git", branch = "master" }

[tool.isort]
profile = "black"
line_length = 120
py_version = 310
known_first_party = "tinyexp"
known_third_party = "wandb"
